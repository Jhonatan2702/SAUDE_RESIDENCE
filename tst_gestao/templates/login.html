<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · TST-GESTÃO</title>
<link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login">
<div class="login-caixa">
  <section class="login-marca">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="">
    <h1>TST-GESTÃO</h1>
    <p>Painéis de acompanhamento de pacientes, terapias e equipe, atualizados automaticamente a cada hora com os dados da Saúde Residence.</p>
  </section>
  <form class="login-form" method="post" autocomplete="off">
    <h2>Acesse sua conta</h2>
    <input type="hidden" name="csrf_token" value="{{ session.get('csrf', '') }}">
    <label>Usuário<input name="usuario" required autofocus></label>
    <label>Senha<input name="senha" type="password" required></label>
    {% if erro %}<div class="alert">{{ erro }}</div>{% endif %}
    <button class="btn primario bloco" type="submit">Entrar</button>
    <small class="muted">Esqueceu a senha? Peça ao administrador do sistema.</small>
  </form>
</div>
</body>
</html>
